<!DOCTYPE html>
<html lang="bs"><head><meta charset="utf-8"><base href="/"><title>share card</title>
<!-- canvas for tools/share-pages.mjs: one 1200×630 preview picture per recipe -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fbf6ee; }
  .pic { position: absolute; inset: 0 0 24px 0; }
  .pic .art { width: 100%; height: 100%; object-fit: cover; display: block; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 24px; }
  .band .kilim { display: block; height: 24px; }
  .name, .brand { display: none; } /* chat apps print the dish name under the picture themselves */
</style></head><body></body></html>
