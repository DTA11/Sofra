[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# temporary photo-prompt helper page — not linked from the app, delete when photos are done
[[headers]]
  for = "/foto-prompts/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# shared recipe links: r/<id>/ pages come from tools/share-pages.mjs; a recipe without a page yet still opens
[[redirects]]
  from = "/r/:id/*"
  to = "/#/recipe/:id"
  status = 302

# canvas for tools/share-pages.mjs only
[[headers]]
  for = "/tools/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
