[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# temporary photo-prompt helper page — not linked from the app, delete when photos are done
[[headers]]
  for = "/foto-prompts/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
